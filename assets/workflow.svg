<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1640" viewBox="0 0 920 1640" role="img" aria-labelledby="title desc">
  <title id="title">Research Growth and Academic Intelligence workflow</title>
  <desc id="desc">A vertical loop from research anchor and personalization, to discovery, screening, evidence verification, contradiction search, publication mapping, output, feedback, and recalibration.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #64748b; }
      .stage { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; letter-spacing: 2px; fill: #475569; }
      .cardTitle { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .cardText { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #475569; }
      .num { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1.5; rx: 24; filter: url(#shadow); }
      .accentA { fill: #0f766e; }
      .accentB { fill: #2563eb; }
      .accentC { fill: #7c3aed; }
      .accentD { fill: #c2410c; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="1640" rx="34"/>

  <text class="title" x="460" y="62" text-anchor="middle">Research Intelligence Loop</text>
  <text class="subtitle" x="460" y="96" text-anchor="middle">从研究目标到证据核验，再回到持续校准</text>

  <!-- 01 -->
  <text class="stage" x="150" y="150">DEFINE</text>
  <rect class="card" x="130" y="168" width="660" height="130"/>
  <circle class="accentA" cx="190" cy="233" r="27"/>
  <text class="num" x="190" y="239" text-anchor="middle">01</text>
  <text class="cardTitle" x="240" y="220">研究锚点与个性化配置</text>
  <text class="cardText" x="240" y="252">研究问题 · 边界 · 目标成果 · 来源池 · 时间预算</text>

  <path class="arrow" d="M460 298 L460 348"/>

  <!-- 02 -->
  <text class="stage" x="150" y="382">DISCOVER</text>
  <rect class="card" x="130" y="400" width="660" height="150"/>
  <circle class="accentB" cx="190" cy="475" r="27"/>
  <text class="num" x="190" y="481" text-anchor="middle">02</text>
  <text class="cardTitle" x="240" y="455">候选发现与多视角扩展</text>
  <text class="cardText" x="240" y="488">核心领域 + 邻近领域 + 中文学术生态 + 学术机会</text>
  <text class="cardText" x="240" y="516">学习者 · 测量 · 认知 · 技术四个视角主动扩展</text>

  <path class="arrow" d="M460 550 L460 600"/>

  <!-- 03 -->
  <rect class="card" x="130" y="620" width="660" height="130"/>
  <circle class="accentB" cx="190" cy="685" r="27"/>
  <text class="num" x="190" y="691" text-anchor="middle">03</text>
  <text class="cardTitle" x="240" y="672">去重、版本归一与价值筛选</text>
  <text class="cardText" x="240" y="704">DOI → 正式题名 → 作者年份 → 版本状态 → 相关性判断</text>

  <path class="arrow" d="M460 750 L460 800"/>

  <!-- 04 -->
  <text class="stage" x="150" y="834">VERIFY</text>
  <rect class="card" x="130" y="852" width="660" height="150"/>
  <circle class="accentC" cx="190" cy="927" r="27"/>
  <text class="num" x="190" y="933" text-anchor="middle">04</text>
  <text class="cardTitle" x="240" y="907">证据获取与 Claim–Evidence Gate</text>
  <text class="cardText" x="240" y="940">正文 &gt; 正式摘要 &gt; 元数据；明确标记证据访问状态</text>
  <text class="cardText" x="240" y="968">每个关键判断都必须回答：证据真的支持这句话吗？</text>

  <path class="arrow" d="M460 1002 L460 1052"/>

  <!-- 05 -->
  <rect class="card" x="130" y="1072" width="660" height="130"/>
  <circle class="accentC" cx="190" cy="1137" r="27"/>
  <text class="num" x="190" y="1143" text-anchor="middle">05</text>
  <text class="cardTitle" x="240" y="1124">反证搜索与历史查重</text>
  <text class="cardText" x="240" y="1156">主动找 no effect · negative evidence · measurement problems</text>

  <path class="arrow" d="M460 1202 L460 1252"/>

  <!-- 06 -->
  <text class="stage" x="150" y="1286">TRANSLATE</text>
  <rect class="card" x="130" y="1304" width="660" height="150"/>
  <circle class="accentD" cx="190" cy="1379" r="27"/>
  <text class="num" x="190" y="1385" text-anchor="middle">06</text>
  <text class="cardTitle" x="240" y="1359">成果映射与周期输出</text>
  <text class="cardText" x="240" y="1392">理论依据 · 方法 · Discussion · 反证边界 · 学术机会</text>
  <text class="cardText" x="240" y="1420">周一方法 · 周三精读 · 周五学术情报</text>

  <path class="arrow" d="M460 1454 L460 1504"/>

  <!-- 07 -->
  <text class="stage" x="150" y="1538">IMPROVE</text>
  <rect class="card" x="130" y="1556" width="660" height="70"/>
  <circle class="accentA" cx="190" cy="1591" r="24"/>
  <text class="num" x="190" y="1597" text-anchor="middle">07</text>
  <text class="cardTitle" x="240" y="1583">用户反馈 → 下一轮权重校准</text>
  <text class="cardText" x="240" y="1610">只根据明确反馈调整，不猜测偏好，也不封锁反证</text>

  <!-- feedback loop -->
  <path class="loop" d="M790 1591 C875 1591, 875 475, 805 475"/>
  <text class="cardText" x="835" y="1030" transform="rotate(-90 835 1030)" text-anchor="middle">continuous recalibration</text>
</svg>
